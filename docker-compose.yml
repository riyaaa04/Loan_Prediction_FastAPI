version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: loan_mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:  ${MYSQL_DATABASE}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: loan_fastapi
    restart: always

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8000:8000"

    command: uvicorn main:app --host 0.0.0.0 --port 8000


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit

    container_name: loan_streamlit
    restart: always

    depends_on:
      - backend

    ports:
      - "8501:8501"


volumes:
  mysql_data: